services:
  postgres:
    image: postgres:16-alpine
    container_name: handloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-handloom_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handloom_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-handloom_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handloom_dev} -d ${POSTGRES_DB:-handloom_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - handloom-net

  redis:
    image: redis:7-alpine
    container_name: handloom-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - handloom-net

networks:
  handloom-net:
    driver: bridge

volumes:
  postgres_data:
    name: handloom_postgres_data
  redis_data:
    name: handloom_redis_data

